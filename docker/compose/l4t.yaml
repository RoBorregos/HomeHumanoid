# Variant for the Jetson Orin (JetPack). Reuses home2's l4t base image
# (vendor/home2/docker/Dockerfile.ROS-l4t) once the submodule is initialized;
# for now it builds from the generic Dockerfile, same as cuda.yaml.
services:
  homehumanoid:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ROS
      args:
        ROS_DISTRO: jazzy
    image: homehumanoid:l4t
    container_name: homehumanoid_l4t
    network_mode: host
    ipc: host
    runtime: nvidia
    volumes:
      - ../../src:/ws/src
      - ../../vendor:/ws/vendor
      - ../../third_party:/ws/third_party
      - ../../worlds:/ws/worlds
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    stdin_open: true
    tty: true
