services:
  homehumanoid:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ROS
      args:
        ROS_DISTRO: jazzy
    image: homehumanoid:cuda
    container_name: homehumanoid_cuda
    network_mode: host
    ipc: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # The whole repo, so ./run.sh, src/, vendor/ and third_party/ are all in /ws.
      - ../..:/ws
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    stdin_open: true
    tty: true
