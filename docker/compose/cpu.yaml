services:
  homehumanoid:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ROS
      args:
        ROS_DISTRO: jazzy
    image: homehumanoid:cpu
    container_name: homehumanoid_cpu
    network_mode: host
    ipc: host
    volumes:
      # The whole repo, so ./run.sh, src/, vendor/ and third_party/ are all in /ws.
      - ../..:/ws
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    stdin_open: true
    tty: true
