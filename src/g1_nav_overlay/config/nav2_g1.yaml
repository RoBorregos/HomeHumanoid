# Nav2 parameters for the G1's Track A kinematic virtual base.
#
# Ported from vendor/home2/navigation/packages/nav_main/config/omni_config/
# nav2_omni.yaml (FRIDA's real-robot holonomic-base profile), adapted:
#   * robot_base_frame/base_frame -> base_link: the G1's planar footprint on
#     the floor, parent of pelvis (g1_description/launch/description.launch.py).
#   * odom_topic -> /odom (g1_base_bridge, g1_rl_bridge, g1_loco_bridge or
#     g1_perception's FAST-LIO adapter, whichever the mode runs)
#   * footprint: a polygon around the standing G1, from its own lidar returns
#     in sim (g1_perception crop box): forearms to 0.38 m in front, torso and
#     hands within +-0.22 m. A 0.3 m circle (the first try) left a 1-2 cell
#     lane through the arena's ~0.8 m exit door and MPPI stalled there
#     ("Failed to make progress"). MEASURE on the real robot's arm pose.
#   * Obstacles come from the 3D MID-360 (g1_perception): /scan, its projection
#     between 0.10 and 1.50 m over the floor, in both costmaps, plus a
#     VoxelLayer on the body-cropped cloud in the local costmap, the G1's
#     counterpart of home2's ZED rgbd_obstacle_layer (table tops, shelves).
#
# This is the "real robot" profile (use_sim_time: False); nav2_g1_sim_overlay.yaml
# deep-merges the sim deltas on top at launch time (see sim_gz.launch.py).

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50
    # Nav2's 20ms default loses the action server's acknowledgement under CPU load,
    # and the behavior tree then aborts the whole goal with no recovery.
    default_server_timeout: 200
    wait_for_service_timeout: 10000
    # No default_nav_to_pose_bt_xml override: nav2's own packaged
    # navigate_to_pose_w_replanning_and_recovery.xml is the same tree home2's
    # copy of this file points at (per that file's own comment) — depending
    # on nav_main's bt/ path isn't needed.

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    odom_topic: /odom
    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 36
      model_dt: 0.07
      batch_size: 1200
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.3
      # Track A's base has no real kinematic limit (it's velocity-driven, not
      # walking) — these are inherited placeholders, tuned for feel/safety
      # rather than a real constraint. Revisit once Track B drives real
      # locomotion limits.
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.5
      wz_max: 1.5
      ax_max: 2.2
      ax_min: -1.8
      ay_max: 2.0
      az_max: 2.5
      iteration_count: 2
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        critical_cost: 300.0
        # The footprint is a polygon (see the header): check its shape, not
        # just the center cell's inflated cost.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
        trajectory_point_step: 3
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1  # NO_DIRECTIONAL_PREFERENCE — 360 deg lidar, free to face any way

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.40, 0.24], [0.40, -0.24], [-0.20, -0.24], [-0.20, 0.24]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        # odom (the costmap's global frame) is on the floor, so z is height.
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0
        observation_sources: lidar3d
        lidar3d:
          topic: /livox/points_filtered
          data_type: "PointCloud2"
          min_obstacle_height: 0.10
          max_obstacle_height: 1.50
          marking: True
          clearing: True
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius must cover the footprint's circumscribed radius
        # (0.49 m with padding) or MPPI's footprint collision check is wrong
        # ("inflation radius is smaller than the circumscribed radius").
        # cost_scaling 5.0 (FRIDA: 3.0) decays fast enough to keep a low-cost
        # lane through the arena's ~0.8 m exit door.
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Clears farther than it marks: marks left behind when slam_toolbox
          # corrects map -> odom are otherwise never cleared (seen at the
          # arena exit: lethal blocks in free space, the robot stuck).
          raytrace_max_range: 6.0
          raytrace_min_range: 0.10
          obstacle_max_range: 3.0
          obstacle_min_range: 0.10
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.40, 0.24], [0.40, -0.24], [-0.20, -0.24], [-0.20, 0.24]]"
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Clears farther than it marks: marks left behind when slam_toolbox
          # corrects map -> odom are otherwise never cleared (seen at the
          # arena exit: lethal blocks in free space, the robot stuck).
          raytrace_max_range: 6.0
          raytrace_min_range: 0.10
          obstacle_max_range: 3.0
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius must cover the footprint's circumscribed radius
        # (0.49 m with padding) or MPPI's footprint collision check is wrong
        # ("inflation radius is smaller than the circumscribed radius").
        # cost_scaling 5.0 (FRIDA: 3.0) decays fast enough to keep a low-cost
        # lane through the arena's ~0.8 m exit door.
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      always_send_full_costmap: False

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      # false, not true: with A* NavFn only computes a partial potential field
      # and path extraction can fail ("Failed to create a plan from potential
      # when a legal potential was found"). Same pose and goal: A* 3/3 failed,
      # Dijkstra succeeded.
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 1.5]
    min_velocity: [-0.3, -0.5, -1.5]
    max_accel: [2.2, 2.0, 2.5]
    max_decel: [-2.2, -2.0, -2.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.05, 0.05, 0.05]
    velocity_timeout: 1.0

# Not part of home2's own setup (older nav2 composable-node topology without
# it), but stock nav2_bringup's navigation_launch.py (used here, see
# docs/plan.md) wires it into the real output path:
# controller_server -> velocity_smoother -> collision_monitor -> /cmd_vel
# (the topic g1_base_bridge actually subscribes to). Values ported from
# nav2_bringup's own default params.yaml, base_frame_id -> base_link.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# Stock nav2_bringup component, not part of home2's own setup. G1 has no
# charging dock in this phase — configured with the default plugin so the
# lifecycle manager's configure step succeeds, but never actually invoked
# (nothing calls the DockRobot action).
docking_server:
  ros__parameters:
    use_sim_time: False
    base_frame: "base_link"
    fixed_frame: "odom"
    # Otherwise it advertises a plain Twist on /cmd_vel next to everyone's
    # TwistStamped (seen in `ros2 topic info /cmd_vel`).
    enable_stamped_cmd_vel: true
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
