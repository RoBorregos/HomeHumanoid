# Gazebo (mode:=gz) deltas deep-merged onto nav2_g1.yaml by g1_navigation (launch_utils.py)
# and vendor/home2/navigation/packages/nav_main/launch/omni_setup/
# nav2_omni.launch.py's _deep_merge(), the pattern this mirrors).
#
# Everything runs on /clock (use_sim_time: True). odom_topic is already /odom
# in the base file (G1 has no real-hardware odometry source analogous to
# FRIDA's /odrive/odom), so this overlay mostly just flips use_sim_time.
#
# transform_tolerance 0.6: the Orin running Gazebo + the whole stack lags
# map -> odom by up to ~0.5 s under load (slam_toolbox scan matching), and
# 0.2 s aborted goals with "Transform data too old". Sim only: the robot keeps
# the base file's 0.2.

bt_navigator:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    FollowPath:
      transform_tolerance: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      transform_tolerance: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      transform_tolerance: 0.6

planner_server:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    transform_tolerance: 0.6

waypoint_follower:
  ros__parameters:
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    transform_tolerance: 0.6

docking_server:
  ros__parameters:
    use_sim_time: True
