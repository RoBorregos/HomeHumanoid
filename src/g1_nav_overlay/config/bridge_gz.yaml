# ros_gz_bridge config for G1's Track A kinematic virtual base.
#
# Mirrors vendor/home2/simulation/frida_gz_sim/config/{bridge.yaml,bridge_nav.yaml}
# combined and trimmed: G1 has one 3D lidar (no laserscan_multi_merger
# needed — that only exists for FRIDA's two-lidar blind-wedge setup) and no
# ZED/arm topics. /clock is essential: without it nothing with use_sim_time:true ticks.
#
# No /odom entry: Gazebo's OdometryPublisher plugin (previously bridged here
# from /sim/odom) was confirmed to stop publishing shortly after spawn on
# this Gazebo Harmonic build, even while the model kept moving — see
# g1_base_bridge's module docstring. /odom is published directly by
# g1_base_bridge instead, dead-reckoned from the same cmd_vel it relays.

# /clock_gz, not /clock: g1_sim_bringup's clock_throttle republishes it on
# /clock at 100 Hz (Gazebo publishes every ~1 ms step, see its source).
- ros_topic_name: /clock_gz
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /sim/cmd_vel
  gz_topic_name: /sim/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# The 3D MID-360 stand-in, under the real livox_ros_driver2 topic names so
# g1_perception runs unchanged in sim and on the robot. /scan is no longer
# bridged: g1_perception projects it from this cloud (pointcloud_to_laserscan).
- ros_topic_name: /livox/lidar
  gz_topic_name: /g1/mid360/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS

- ros_topic_name: /livox/imu
  gz_topic_name: /g1/mid360_imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
