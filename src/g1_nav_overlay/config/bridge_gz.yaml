# ros_gz_bridge config for G1's Track A kinematic virtual base.
#
# Mirrors vendor/home2/simulation/frida_gz_sim/config/{bridge.yaml,bridge_nav.yaml}
# combined and trimmed: G1 has one lidar (no laserscan_multi_merger needed —
# that only exists for FRIDA's two-lidar blind-wedge setup) and no ZED/arm
# topics. /clock is essential: without it nothing with use_sim_time:true ticks.
#
# No /odom entry: Gazebo's OdometryPublisher plugin (previously bridged here
# from /sim/odom) was confirmed to stop publishing shortly after spawn on
# this Gazebo Harmonic build, even while the model kept moving — see
# g1_base_bridge's module docstring. /odom is published directly by
# g1_base_bridge instead, dead-reckoned from the same cmd_vel it relays.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /sim/cmd_vel
  gz_topic_name: /sim/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /scan
  gz_topic_name: /g1/mid360_scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
