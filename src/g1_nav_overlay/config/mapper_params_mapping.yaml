# slam_toolbox MAPPING (build a new map from scratch) for the G1, sim and robot.
#
# Input is /scan, projected by g1_perception from the 3D MID-360 between 0.10
# and 1.50 m over the floor: walls, furniture legs and table edges all end up
# in the 2D map, so home2's map tools (map_area_tagger, areas.json, nav_ui)
# keep working. Odometry under it is the bridge's (sim) or FAST-LIO (robot).
#
# Ported from vendor/home2/navigation/packages/nav_main/config/omni_config/
# mapper_params_online_async.yaml, loaded by vendor/home2/navigation/packages/
# nav_main/launch/omni_setup/slam.launch.py (included unmodified — see
# docs/plan.md). Drive the G1 around (teleop, or Nav2 goals with
# g1_navigation mapping.launch.py nav2:=true), then save with
#   src/g1_navigation/scripts/run_nav.sh --save-map <name>
# or nav_ui's "Save Map" button: both write <name>.{yaml,pgm,posegraph,data}
# into src/g1_navigation/maps.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05  # 20 Hz: 50 Hz made nav_central's Python TF listener a CPU hog
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.20
    max_laser_range: 20.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 20.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
