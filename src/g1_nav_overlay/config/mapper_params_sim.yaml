# slam_toolbox LOCALIZATION (against a pre-built map) for G1 in sim.
#
# Ported from vendor/home2/simulation/frida_gz_sim/config/mapper_params_sim.yaml,
# loaded by vendor/home2/navigation/packages/nav_main/launch/omni_setup/
# localization.launch.py (included unmodified — see docs/plan.md, Fase 4).
# The `map` launch arg there overrides map_file_name with whichever serialized
# pose-graph is being localized against (defaults to robocup2026_1 for the
# first smoke test; later, G1's own mapped-and-tagged map from Fase 2).
#
# map_start_pose below matches robocup2026_1's start_location.safe_place
# ([4.17764, -11.69743], quaternion qz=-0.8385 qw=0.5449 -> yaw ~ -1.989 rad),
# confirmed from vendor/home2/navigation/packages/map_context/maps/areas/
# areas_robocup2026_1.json. Keep this in sync with sim_gz.launch.py's
# spawn_x/spawn_y/spawn_yaw args and initial_pose.py's x/y/yaw params —
# all three must agree on where G1 starts.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY

    odom_frame: odom
    map_frame: map
    base_frame: pelvis
    scan_topic: /scan

    mode: localization
    map_file_name: /tmp/g1_maps/robocup2026_1  # overridden by the `map` launch arg
    map_start_pose: [4.17764, -11.69743, -1.989]

    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.3
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    do_loop_closing: true
    loop_search_maximum_distance: 3.0
