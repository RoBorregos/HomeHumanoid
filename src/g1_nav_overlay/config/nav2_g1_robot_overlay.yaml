# Real-G1 deltas deep-merged onto nav2_g1.yaml by g1_navigation (mode:=robot).
#
# Same controller as the MuJoCo track (Regulated Pure Pursuit, turn on the spot
# then walk: the walking policy couples combined forward + turn commands into
# sideways drift, see nav2_g1_mujoco_overlay.yaml), but with the lidar layers on
# and the velocity limits of g1_loco_bridge's clamps (max_vx 0.3, max_vy 0.2,
# max_wz 0.3). NOT TESTED ON HARDWARE: first runs on the gantry with the
# remote's e-stop in hand (docs/plan.md, M5).

controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.8
      max_angular_accel: 3.0
      allow_reversing: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.10
      use_cost_regulated_linear_velocity_scaling: true

behavior_server:
  ros__parameters:
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.6

velocity_smoother:
  ros__parameters:
    max_velocity: [0.3, 0.2, 0.3]
    min_velocity: [-0.1, -0.2, -0.3]
    max_accel: [0.5, 0.5, 0.6]
    max_decel: [-0.6, -0.6, -0.8]
