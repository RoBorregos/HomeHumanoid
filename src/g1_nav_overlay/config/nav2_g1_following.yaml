# Follow-person deltas, applied live by g1_navigation's person_goal_smoother
# when /navigation/set_follow_mode is on (and reverted from the mode's merged
# config when off). Ported from home2 nav_main/config/omni_config/
# nav2_omni_following.yaml. Keys that the active controller does not have
# (MPPI's on gz, RPP's on mujoco/robot) are skipped by the smoother.
controller_server:
  ros__parameters:
    FollowPath:
      # MPPI (mode gz)
      vx_max: 0.5
      vx_min: -0.3
      vy_max: 0.5
      wz_max: 1.0
      GoalCritic:
        cost_weight: 3.0
      PathAlignCritic:
        cost_weight: 8.0
      PathFollowCritic:
        cost_weight: 10.0
      PathAngleCritic:
        cost_weight: 2.0
      CostCritic:
        cost_weight: 4.0
      # RPP (modes mujoco, robot): a little faster to keep up with a person,
      # still within g1_loco_bridge's 0.3 m/s clamp.
      desired_linear_vel: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.55  # >= footprint circumscribed radius (nav2_g1.yaml)

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        cost_scaling_factor: 5.0
        inflation_radius: 0.55  # >= footprint circumscribed radius (nav2_g1.yaml)
