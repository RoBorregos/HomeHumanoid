# Track B deltas deep-merged onto nav2_g1.yaml by sim_mujoco.launch.py.
#
# unitree_mujoco's scene has no arena and no lidar, so there is no /scan: every
# scan-based layer is off and map -> odom is a fixed identity. This exercises
# the cmd_vel -> walking -> odom loop, NOT obstacle avoidance. Walls don't exist
# physically either: the static layer is the controller's only view of them.
#
# Regulated Pure Pursuit instead of MPPI. The walking policy tracks forward and
# turn-in-place commands well through g1_rl_bridge's compensation tables, but
# combining them couples into sideways drift (0.4 m/s with 0.4 rad/s produced
# 0.21 m/s to the side). MPPI assumes an ideal omni base, so it left the path into
# inscribed cells it couldn't recover from. RPP turns on the spot, then walks.

controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      # Short, so the carrot doesn't cut corners through narrow doorways.
      lookahead_dist: 0.45
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      # The policy doesn't turn cleanly on the spot, it walks a small circle: half a
      # turn displaces it about 0.64m at 0.41 rad/s but about 0.4m at 0.16 rad/s. Near
      # a wall that difference decides whether it ends up in an inscribed cell.
      rotate_to_heading_angular_vel: 0.16
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.8
      # RPP ramps from the measured turn rate. At 1.0 it asks for 0.05 rad/s on a robot
      # that isn't turning, which velocity_smoother's deadband zeroes, so it never turns.
      max_angular_accel: 6.0
      allow_reversing: false
      transform_tolerance: 0.2
      # 0.18, not 0.12: on the final approach the policy barely moves at
      # 0.12, so the robot stopped ~0.35 m out, right on xy_goal_tolerance,
      # and flipped between turning to the path and to the goal heading for
      # minutes (laundry, 2026-11-10, with leg odometry).
      min_approach_linear_velocity: 0.18
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # Stays above the policy's dead zone, where the commands stop doing anything.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: false

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # No walls exist in this scene: keep the old small circle, not the polygon.
      footprint: "[]"
      robot_radius: 0.2

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "inflation_layer"]
      # No walls exist in this scene: keep the old small circle, not the polygon.
      footprint: "[]"
      robot_radius: 0.2
      # Keeps plans in the middle of a passage, away from the inscribed band.
      inflation_layer:
        cost_scaling_factor: 2.5
        inflation_radius: 0.6

behavior_server:
  ros__parameters:
    # From an inscribed cell, the default 2s horizon reports a collision for every
    # spin and backup, so the recoveries that could free the robot never run.
    simulate_ahead_time: 0.5
    max_rotational_vel: 0.3
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.4

velocity_smoother:
  ros__parameters:
    max_velocity: [0.25, 0.1, 0.3]
    min_velocity: [-0.1, -0.1, -0.3]
    max_accel: [0.5, 0.5, 0.6]
    max_decel: [-0.5, -0.5, -0.6]

collision_monitor:
  ros__parameters:
    FootprintApproach:
      enabled: False
    scan:
      enabled: False
