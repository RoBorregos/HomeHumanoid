# Track B deltas deep-merged onto nav2_g1.yaml by sim_mujoco.launch.py.
#
# Velocity limits follow what the G1 velocity policy was trained on
# (unitree_rl_lab: g1_29dof/config/policy/velocity/v0/params/deploy.yaml):
# vx [-0.5, 1.0], vy [-0.3, 0.3], wz [-0.2, 0.2]. g1_rl_bridge clamps to the
# same range, but MPPI has to know them or it plans motions the robot can't do.
# vx stays below the policy's maximum until walking is proven stable.
#
# unitree_mujoco's scene has no arena and no lidar, so there is no /scan: every
# scan-based layer is off and map -> odom is a fixed identity. This exercises
# the cmd_vel -> walking -> odom loop, NOT obstacle avoidance.

controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.25
      movement_time_allowance: 30.0
    FollowPath:
      vx_max: 0.4
      vx_min: -0.2
      vy_max: 0.2
      wz_max: 0.2
      ax_max: 0.5
      ax_min: -0.5
      ay_max: 0.5
      az_max: 0.4
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["inflation_layer"]

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "inflation_layer"]

behavior_server:
  ros__parameters:
    max_rotational_vel: 0.2
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.4

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.2, 0.2]
    min_velocity: [-0.2, -0.2, -0.2]
    max_accel: [0.5, 0.5, 0.4]
    max_decel: [-0.5, -0.5, -0.4]

collision_monitor:
  ros__parameters:
    FootprintApproach:
      enabled: False
    scan:
      enabled: False
