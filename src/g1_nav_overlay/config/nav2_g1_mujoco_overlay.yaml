# Track B deltas deep-merged onto nav2_g1.yaml by sim_mujoco.launch.py.
#
# Velocity limits are what the walking policy actually reaches in MuJoCo, after
# g1_rl_bridge's compensation tables, not its command range: about 0.4 m/s
# forward, 0.35 m/s sideways and 0.4 rad/s turning. MPPI has to know them or it
# plans motions the robot can't do. Slightly under those to leave margin.
#
# unitree_mujoco's scene has no arena and no lidar, so there is no /scan: every
# scan-based layer is off and map -> odom is a fixed identity. This exercises
# the cmd_vel -> walking -> odom loop, NOT obstacle avoidance.

controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.2
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.35
    FollowPath:
      vx_max: 0.35
      vx_min: -0.15
      vy_max: 0.25
      wz_max: 0.35
      ax_max: 0.5
      ax_min: -0.5
      ay_max: 0.5
      az_max: 0.4
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["inflation_layer"]

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["static_layer", "inflation_layer"]

behavior_server:
  ros__parameters:
    max_rotational_vel: 0.35
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.4

velocity_smoother:
  ros__parameters:
    max_velocity: [0.35, 0.25, 0.35]
    min_velocity: [-0.15, -0.25, -0.35]
    max_accel: [0.5, 0.5, 0.4]
    max_decel: [-0.5, -0.5, -0.4]

collision_monitor:
  ros__parameters:
    FootprintApproach:
      enabled: False
    scan:
      enabled: False
